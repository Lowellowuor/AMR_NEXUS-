[project]
name = "amr-nexus-ml"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["venv", ".venv", "__pycache__", "mlruns", "saved_models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Globally ignored rules with rationale:
#   B904 - "raise from err" in except blocks: pre-existing throughout the
#          codebase; the chained exception is available for debugging but
#          the explicit raise is used to shape the HTTP response
#   E402 - module-level import not at top (used in scripts and tests)
#   E501 - line too long (formatter handles wrapping)
#   E711 - comparison to None (SQLAlchemy idiom: col == None is intentional)
#   E712 - comparison to True (SQLAlchemy idiom for boolean filters)
#   E741 - ambiguous variable name (l in list comprehensions)
ignore = [
    "B904",
    "E402",
    "E501",
    "E711",
    "E712",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI route handlers legitimately use Depends() and Query() in defaults
"src/api/routers/*.py" = ["B008", "F811", "UP017", "UP045"]
"src/api/deps.py" = ["B008"]
"src/modules/*/router.py" = ["B008"]
"src/main.py" = ["B008", "I001", "UP006", "UP035", "UP045"]
# Re-export files legitimately have unused imports
"src/api/routers/__init__.py" = ["F401"]
"src/db/models.py" = ["I001", "UP017", "W291"]
"src/services/llm_service.py" = ["UP045"]
"src/services/model_health.py" = ["UP045"]
"backfill_hotspots_v2.py" = ["B007"]
"train.py" = ["I001", "UP006", "UP035", "UP045", "UP017"]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
