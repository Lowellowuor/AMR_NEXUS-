[project]
name = "amr-nexus-ml"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["venv", ".venv", "__pycache__", "mlruns", "saved_models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 is a false positive for FastAPI's Depends()/Query() idiom
"src/api/routers/*.py" = ["B008"]
# Pre-existing debt in predictions.py; deferred
"src/api/routers/predictions.py" = ["B008", "B904", "E402", "E712", "F811", "I001", "UP017", "UP045"]
# Pre-existing debt in search_router.py /query endpoint; deferred
"src/api/routers/search_router.py" = ["B904", "E712"]
"src/modules/*/router.py" = ["B008"]
# Pre-existing debt in main.py; deferred to a dedicated cleanup PR
"src/main.py" = ["B008", "B904", "I001", "UP006", "UP035", "UP045"]
# Pre-existing debt in src/db/models.py; deferred
"tests/*" = ["B011"]
