[project]
name = "amr-nexus-ml"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["venv", ".venv", "__pycache__", "mlruns", "saved_models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 is a false positive for FastAPI's Depends()/Query() idiom
"src/api/routers/*.py" = ["B008"]
"src/modules/*/router.py" = ["B008"]
"tests/*" = ["B011"]