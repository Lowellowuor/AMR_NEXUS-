# Pre-commit hooks for the AMR Nexus monorepo.
#
# Backend: Python files under Backend/amr_nexus_ml/ (Ruff)
# Frontend: JS/JSX under frontend/src/ (ESLint)
#
# ESLint runs from the frontend/ directory so it resolves its config and
# plugins from frontend/node_modules.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        name: ruff (backend)
        args: [--fix]
        files: ^Backend/amr_nexus_ml/.*\.py$
      - id: ruff-format
        name: ruff-format (backend)
        files: ^Backend/amr_nexus_ml/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^Backend/amr_nexus_ml/.*\.(py|toml|yaml|yml|md|txt)$
      - id: trailing-whitespace
        files: ^Backend/amr_nexus_ml/.*\.(py|toml|yaml|yml|md|txt)$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: cmd /c "cd frontend && npx eslint src"
        language: system
        files: ^frontend/src/.*\.(js|jsx)$
        pass_filenames: false
        verbose: true
      - id: eslint-frontend-config
        name: eslint (frontend config)
        entry: cmd /c "cd frontend && npx eslint *.config.js"
        language: system
        files: ^frontend/.*\.config\.js$
        pass_filenames: false
        verbose: true